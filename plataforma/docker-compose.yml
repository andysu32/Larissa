services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aprenda
      POSTGRES_PASSWORD: aprenda
      POSTGRES_DB: aprenda
    ports:
      - "5432:5432"
    volumes:
      - aprenda-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aprenda -d aprenda"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  aprenda-pg:
