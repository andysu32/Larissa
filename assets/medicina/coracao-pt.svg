<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="tituloCoracao descCoracao">
  <title id="tituloCoracao">Fluxo do sangue no coração, em português</title>
  <desc id="descCoracao">O lado direito do coração manda sangue aos pulmões. O lado esquerdo manda sangue ao corpo.</desc>
  <rect width="760" height="460" fill="#fbfaf6"/>
  <text x="28" y="36" fill="#172421" font-family="Georgia, serif" font-size="26">Fluxo do sangue</text>
  <text x="28" y="58" fill="#5b6763" font-family="Arial, sans-serif" font-size="14">Vista de quem olha o peito: o lado direito da pessoa fica à esquerda do desenho.</text>
  <rect x="28" y="84" width="330" height="300" rx="22" fill="#e7f1f8" stroke="#2a6f97"/>
  <text x="48" y="116" fill="#1d4e6f" font-family="Arial, sans-serif" font-size="15" font-weight="700">Lado direito · pouco oxigênio</text>
  <g font-family="Arial, sans-serif" font-size="16" fill="#172421">
    <rect x="58" y="138" width="270" height="36" rx="18" fill="#fff"/>
    <text x="193" y="162" text-anchor="middle">Veias cavas</text>
    <rect x="58" y="186" width="270" height="40" rx="18" fill="#2a6f97"/>
    <text x="193" y="212" text-anchor="middle" fill="#fff">Átrio direito</text>
    <rect x="58" y="238" width="270" height="36" rx="18" fill="#fff"/>
    <text x="193" y="262" text-anchor="middle">Valva tricúspide</text>
    <rect x="58" y="286" width="270" height="40" rx="18" fill="#1d4e6f"/>
    <text x="193" y="312" text-anchor="middle" fill="#fff">Ventrículo direito</text>
    <text x="193" y="360" text-anchor="middle" fill="#1d4e6f">sai pela valva pulmonar</text>
  </g>
  <rect x="402" y="84" width="330" height="300" rx="22" fill="#fbecee" stroke="#9c3d4a"/>
  <text x="422" y="116" fill="#8d3e36" font-family="Arial, sans-serif" font-size="15" font-weight="700">Lado esquerdo · oxigenado</text>
  <g font-family="Arial, sans-serif" font-size="16" fill="#172421">
    <rect x="432" y="138" width="270" height="36" rx="18" fill="#fff"/>
    <text x="567" y="162" text-anchor="middle">Veias pulmonares</text>
    <rect x="432" y="186" width="270" height="40" rx="18" fill="#9c3d4a"/>
    <text x="567" y="212" text-anchor="middle" fill="#fff">Átrio esquerdo</text>
    <rect x="432" y="238" width="270" height="36" rx="18" fill="#fff"/>
    <text x="567" y="262" text-anchor="middle">Valva mitral</text>
    <rect x="432" y="286" width="270" height="40" rx="18" fill="#6e2430"/>
    <text x="567" y="312" text-anchor="middle" fill="#fff">Ventrículo esquerdo</text>
    <text x="567" y="360" text-anchor="middle" fill="#8d3e36">sai pela valva aórtica</text>
  </g>
  <text x="28" y="420" fill="#5b6763" font-family="Arial, sans-serif" font-size="14">Pulmões ficam entre os dois lados. O nó sinoatrial, o marcapasso, está no átrio direito.</text>
  <text x="28" y="444" fill="#5b6763" font-family="Arial, sans-serif" font-size="14">Diagrama original desta página. Rótulos em português.</text>
</svg>
